name: ick

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - run: |
          git config --global user.name "Unit Test"
          git config --global user.email "example@example.com"
          uvx ick --rules-repo=. test-rules
