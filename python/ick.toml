[[rule]]
name = "argv_scope"
scope = "repo"
impl = "python"
inputs = ["ick.toml", "*.py"]
deps = ["libcst", "fixit"]
description = "Check the rule is using sys.argv appropriately for its scope"

[[rule]]
name = "ruleset_init"
scope = "repo"
impl = "python"
inputs = ["ick.toml", "*.py"]
description = "Check that a rule isn't importing in a way that will shadow stdlib or other needed modules"
